<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiSTer Bildschirmspiegel</title>
<style>
  :root{ --accent:#e0b64a; --bg:#0d0f14; --fg:#f4f6fb; --dim:#9aa3b2; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:var(--bg);
    font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--fg)}
  #wrap{display:flex;flex-direction:column;align-items:center;
    justify-content:center;height:100%;gap:14px;padding:16px}
  #frame{
    max-width:100%;max-height:calc(100vh - 60px);
    image-rendering:pixelated;
    border:1px solid rgba(255,255,255,.10);
    border-radius:6px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    background:#1a1e27;
  }
  #status{color:var(--dim);font-size:13px;display:flex;
    align-items:center;gap:8px}
  #dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
    transition:opacity .3s}
  #dot.stale{background:#8a4444}
  #hint{color:var(--dim);font-size:12px;opacity:.7}
</style>
</head>
<body>
<div id="wrap">
  <img id="frame" alt="Aktueller Bildschirminhalt">
  <div id="status"><span id="dot"></span><span id="statustext">verbinde...</span></div>
  <div id="hint">Live-Abbild des Frontends – aktualisiert sich automatisch, sobald sich etwas ändert</div>
</div>
<script>
// Bewusst simples Polling statt Websocket/SSE fuer das Bild selbst:
// BUGFIX (Nutzer-Rueckmeldung nach dem ersten echten Test: "die
// 2-Sekunden-Aktualisierung sieht aus wie Standbilder, geht das
// fluessiger?" - und als Zweites: "noch fluessiger geht nicht?"):
// serverseitig kodiert das Frontend jetzt deutlich oefter neu, sobald
// sich der Bildschirm aendert (siehe _screen_mirror_loop() in
// frontend.py, mittlerweile 0.2s Pruefintervall) - das bringt aber
// nichts, wenn der Browser weiterhin seltener nachfragt. Intervall
// entsprechend mitgezogen. Haeufigeres Nachfragen ist im lokalen
// Netzwerk unbedenklich (kleines Bild, wenige KB) - fragt der Browser
// schneller nach als das Frontend neu kodiert, bekommt er einfach
// wiederholt dasselbe, noch aktuelle Bild zurueck.
const img = document.getElementById("frame");
const dot = document.getElementById("dot");
const statustext = document.getElementById("statustext");
// GEAENDERT (Nutzer-Rueckmeldung nach dem Absenken des Server-Takts auf
// 0.15s: "hab jetzt keinen unterschied gemerkt"): genau deshalb nicht -
// der Server kodierte zwar oefter, der Browser fragte aber weiterhin nur
// alle 250ms nach. Damit blieb die tatsaechlich sichtbare Bildrate bei
// 4/s haengen, egal was das Frontend tat: DER BROWSER war die Bremse,
// nicht die Kodierung. Jetzt bewusst etwas SCHNELLER als der Server
// kodiert (120ms gegen 150ms) - so wird jedes neu kodierte Bild
// garantiert ohne zusaetzliche Wartezeit abgeholt, statt im
// unguenstigsten Fall fast einen ganzen Takt liegenzubleiben. Fragt der
// Browser oefter nach als neu kodiert wird, bekommt er einfach dasselbe,
// noch aktuelle Bild zurueck - im lokalen Netz unbedenklich, das Bild
// ist nur wenige KB gross und wird serverseitig nur aus dem Speicher
// herausgereicht (kein erneutes Kodieren, siehe /screen.png).
const INTERVAL_MS = 120;

function refresh() {
  const probe = new Image();
  probe.onload = () => {
    img.src = probe.src;
    dot.classList.remove("stale");
    statustext.textContent = "aktiv";
  };
  probe.onerror = () => {
    dot.classList.add("stale");
    statustext.textContent = "noch kein Bild – warte auf das Frontend";
  };
  probe.src = "/screen.png?t=" + Date.now();
}

refresh();
setInterval(refresh, INTERVAL_MS);
</script>
</body>
</html>
