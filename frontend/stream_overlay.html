<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MiSTer Stream Overlay</title>
<style>
  :root{
    --accent:#e0b64a; --bg:#0d0f14; --fg:#f4f6fb; --dim:#9aa3b2;
    --scale:1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--fg)}
  #stage{position:fixed;inset:0;pointer-events:none}
  .card{
    position:absolute;display:flex;gap:calc(20px*var(--scale));
    align-items:flex-end;
    padding:calc(18px*var(--scale)) calc(22px*var(--scale));
    background:linear-gradient(135deg,rgba(13,15,20,.92),rgba(13,15,20,.72));
    border:1px solid rgba(255,255,255,.08);
    border-left:calc(4px*var(--scale)) solid var(--accent);
    border-radius:calc(14px*var(--scale));
    box-shadow:0 calc(18px*var(--scale)) calc(50px*var(--scale)) rgba(0,0,0,.55);
    backdrop-filter:blur(6px);
    transform:translateY(0);transition:opacity .35s ease, transform .35s ease;
    max-width:min(46vw,calc(560px*var(--scale)));
  }
  .card.solid{background:var(--bg)}
  .corner-bottom-left{left:calc(40px*var(--scale));bottom:calc(40px*var(--scale))}
  .corner-bottom-right{right:calc(40px*var(--scale));bottom:calc(40px*var(--scale))}
  .corner-top-left{left:calc(40px*var(--scale));top:calc(40px*var(--scale))}
  .corner-top-right{right:calc(40px*var(--scale));top:calc(40px*var(--scale))}
  .boxart{
    width:calc(150px*var(--scale));height:calc(210px*var(--scale));
    flex:none;border-radius:calc(8px*var(--scale));object-fit:contain;
    background:#1a1e27;border:1px solid rgba(255,255,255,.10);
    box-shadow:0 calc(6px*var(--scale)) calc(18px*var(--scale)) rgba(0,0,0,.5)}
  .boxart.hidden{display:none}
  .meta{display:flex;flex-direction:column;gap:calc(8px*var(--scale));
    padding-bottom:calc(4px*var(--scale));min-width:0}
  .brand{font-size:calc(13px*var(--scale));letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);font-weight:700}
  .brand:empty{display:none}
  .sys{align-self:flex-start;font-size:calc(13px*var(--scale));
    letter-spacing:.06em;text-transform:uppercase;color:#0d0f14;
    background:var(--accent);font-weight:700;
    padding:calc(3px*var(--scale)) calc(10px*var(--scale));
    border-radius:calc(20px*var(--scale))}
  .sys.hidden{display:none}
  .cat{font-size:calc(14px*var(--scale));color:var(--dim);font-weight:600}
  .title{font-size:calc(30px*var(--scale));font-weight:800;line-height:1.1;
    text-shadow:0 calc(2px*var(--scale)) calc(6px*var(--scale)) rgba(0,0,0,.6);
    overflow-wrap:anywhere;display:flex;align-items:center;
    gap:calc(10px*var(--scale))}
  .star{color:var(--accent);font-size:calc(22px*var(--scale));
    display:none;flex:none}
  .star.on{display:inline}
  .facts{display:flex;flex-wrap:wrap;gap:calc(6px*var(--scale))
    calc(14px*var(--scale));margin-top:calc(2px*var(--scale))}
  .facts.hidden{display:none}
  .facts .fact{font-size:calc(13px*var(--scale));color:var(--dim);
    white-space:nowrap}
  .facts .fact.hidden{display:none}
  .facts .fact.ra{color:var(--accent);font-weight:700}
  .list{display:flex;flex-direction:column;gap:calc(3px*var(--scale));
    margin-top:calc(4px*var(--scale))}
  .list.hidden{display:none}
  .list .row{font-size:calc(14px*var(--scale));color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7}
  .list .row.cur{color:var(--fg);opacity:1;font-weight:700}
  .list .row.cur::before{content:"\25B8  ";color:var(--accent)}
  .np{display:flex;align-items:center;gap:calc(8px*var(--scale));
    font-size:calc(14px*var(--scale));color:var(--dim);
    margin-top:calc(6px*var(--scale))}
  .np.hidden{display:none}
  .np .dot{width:calc(8px*var(--scale));height:calc(8px*var(--scale));
    border-radius:50%;background:var(--accent);flex:none;
    animation:pulse 1.6s infinite ease-in-out}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .flash{animation:flash .4s ease}
  @keyframes flash{from{transform:translateY(calc(6px*var(--scale)));opacity:.55}
    to{transform:translateY(0);opacity:1}}

  /* Erfolgs-Einblendung: eigener Toast, immer oben rechts - unabhaengig
     von der "corner"-Einstellung der normalen Auswahl-Karte, damit sich
     beide nie ueberschneiden koennen, egal welche Ecke dort gewaehlt ist. */
  #achievement-toast{
    position:absolute;top:calc(30px*var(--scale));right:calc(30px*var(--scale));
    display:flex;gap:calc(14px*var(--scale));align-items:center;
    padding:calc(14px*var(--scale)) calc(18px*var(--scale));
    background:linear-gradient(135deg,rgba(13,15,20,.95),rgba(13,15,20,.80));
    border:1px solid rgba(255,255,255,.10);
    border-right:calc(4px*var(--scale)) solid #ffd452;
    border-radius:calc(12px*var(--scale));
    box-shadow:0 calc(14px*var(--scale)) calc(40px*var(--scale)) rgba(0,0,0,.6);
    max-width:calc(420px*var(--scale));
    opacity:0;transform:translateX(calc(20px*var(--scale)));
    transition:opacity .4s ease, transform .4s ease;
    pointer-events:none;
  }
  #achievement-toast.show{opacity:1;transform:translateX(0)}

  /* DER EINBLEND-MOMENT (Build 252).
     Vorher: nur opacity plus 20 Punkte von rechts. Das ist eine
     Benachrichtigung und kein Moment - gerade auf einem Stream, wo
     der Zuschauer nicht weiss, dass gleich etwas kommt, braucht es
     einen Akzent im ersten Drittel.
     Drei Zutaten, alle rein in CSS:
       1. Zurueckfedern statt linearem Ankommen (cubic-bezier mit
          Ueberschwinger).
       2. Das Badge dreht sich einmal aus der Tiefe herein.
       3. Ein Lichtstreifen laeuft einmal quer ueber die Karte.
     KEINE neue Datenleitung, kein zusaetzliches Feld im Ereignis -
     deshalb laeuft es auch mit jedem bestehenden Frontend. */
  #achievement-toast.show{
    transition:opacity .28s ease,
               transform .55s cubic-bezier(.17,.89,.32,1.28)}
  #achievement-toast.show .badge{animation:badge-in .7s
    cubic-bezier(.2,.8,.25,1) both}
  @keyframes badge-in{
    from{transform:perspective(600px) rotateY(-90deg) scale(.6);opacity:0}
    60%{transform:perspective(600px) rotateY(12deg) scale(1.06);opacity:1}
    to{transform:none;opacity:1}}
  /* Der Lichtstreifen liegt UEBER der Karte und faengt keine Klicks
     ab - das ganze Overlay ist pointer-events:none, aber ein
     Pseudoelement erbt das nicht zuverlaessig in jedem Browser. */
  #achievement-toast::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;overflow:hidden;opacity:0;
    background:linear-gradient(105deg,transparent 35%,
      rgba(255,212,82,.22) 48%,rgba(255,255,255,.30) 52%,
      transparent 66%);
    background-size:260% 100%;background-position:120% 0}
  #achievement-toast.show::after{animation:sheen .85s ease-out .18s both}
  @keyframes sheen{
    from{opacity:0;background-position:120% 0}
    25%{opacity:1}
    to{opacity:0;background-position:-40% 0}}

  /* DIE ERFOLGS-WAND (Build 253).
     Alle Erfolge des laufenden Spiels als Raster, freigeschaltete in
     Farbe, die uebrigen ausgegraut - nach einem Screenshot des
     Nutzers.

     AUSGEGRAUT WIRD MIT EINEM FILTER, nicht mit einem zweiten Bild.
     RetroAchievements hat zwar eigene "lock"-Icons, aber dasselbe
     farbige Icon plus grayscale() gibt denselben Look - ohne eine
     zweite Download-Sorte und ohne Abhaengigkeit von einer
     Namenskonvention, die wir nicht nachgeprueft haben. */
  #ra-wall{
    position:absolute;display:none;flex-direction:column;
    gap:calc(8px*var(--scale));
    padding:calc(12px*var(--scale)) calc(14px*var(--scale));
    background:linear-gradient(135deg,rgba(13,15,20,.92),rgba(13,15,20,.74));
    border:1px solid rgba(255,255,255,.08);
    border-radius:calc(12px*var(--scale));
    box-shadow:0 calc(14px*var(--scale)) calc(40px*var(--scale))
      rgba(0,0,0,.55);
    backdrop-filter:blur(6px);
    pointer-events:none;
  }
  #ra-wall.on{display:flex}
  #ra-wall.solid{background:var(--bg)}
  /* Eigene Ecke, unabhaengig von der Auswahl-Karte - sonst liegen sie
     uebereinander, und welche oben ist, haengt von der Reihenfolge im
     Dokument ab. */
  #ra-wall.wall-top-right{right:calc(30px*var(--scale));
    top:calc(30px*var(--scale))}
  #ra-wall.wall-top-left{left:calc(30px*var(--scale));
    top:calc(30px*var(--scale))}
  #ra-wall.wall-bottom-right{right:calc(30px*var(--scale));
    bottom:calc(30px*var(--scale))}
  #ra-wall.wall-bottom-left{left:calc(30px*var(--scale));
    bottom:calc(30px*var(--scale))}
  /* Steht die Wand oben rechts, muss der Erfolgs-Toast ihr ausweichen -
     sonst liegt er darauf. */
  #ra-wall.wall-top-right ~ #achievement-toast{
    top:auto;bottom:calc(30px*var(--scale))}
  #ra-wall-head{display:flex;align-items:baseline;
    gap:calc(10px*var(--scale));
    font-size:calc(12px*var(--scale));color:var(--dim);
    white-space:nowrap}
  #ra-wall-head b{color:var(--fg);font-size:calc(13px*var(--scale))}
  #ra-wall-head .pts{color:var(--accent);font-weight:600}
  #ra-wall-bar{height:calc(3px*var(--scale));border-radius:999px;
    background:rgba(255,255,255,.12);overflow:hidden}
  #ra-wall-bar i{display:block;height:100%;width:0;border-radius:999px;
    background:var(--accent);transition:width .6s ease}
  /* Build 254: ein Fenster um das Raster. Ist "Zeilen" gesetzt, wird
     es auf diese Hoehe begrenzt und laeuft langsam durch - sonst
     waere eine Wand mit 98 Erfolgen auf 1080p entweder winzig oder
     halb so hoch wie das Bild. */
  #ra-wall-view{overflow:hidden}
  #ra-wall-grid{display:grid;gap:calc(3px*var(--scale));
    will-change:transform}
  #ra-wall-grid img{
    width:calc(26px*var(--scale));height:calc(26px*var(--scale));
    border-radius:calc(4px*var(--scale));display:block;
    background:#1a1e27;
    /* Ausgegraut ist der Normalfall - die meisten Erfolge hat man
       noch nicht. */
    filter:grayscale(1) brightness(.42) contrast(.9);
    opacity:.75;
    transition:filter .9s ease, opacity .9s ease, transform .5s ease}
  #ra-wall-grid img.an{filter:none;opacity:1}
  /* DER MOMENT, UM DEN ES GEHT: eine Kachel, die gerade umgeschlagen
     ist, soll man SEHEN. Sonst ist die Wand nur eine Tabelle. */
  #ra-wall-grid img.frisch{animation:kachel-an 1.1s
    cubic-bezier(.2,.8,.25,1) both}
  @keyframes kachel-an{
    0%{filter:grayscale(1) brightness(.42);opacity:.75;transform:none}
    18%{filter:grayscale(0) brightness(2.2);opacity:1;
        transform:scale(1.45)}
    45%{filter:none;opacity:1;transform:scale(1.12)}
    100%{filter:none;opacity:1;transform:none}}
  /* Eine leere Kachel (Erfolg ohne Icon) soll kein Loch reissen. */
  #ra-wall-grid .leer{
    width:calc(26px*var(--scale));height:calc(26px*var(--scale));
    border-radius:calc(4px*var(--scale));
    background:rgba(255,255,255,.05)}

  @media (prefers-reduced-motion: reduce){
    #ra-wall-grid img.frisch{animation:none}
    #ra-wall-bar i{transition:none}
  }

  /* MEHRERE ERFOLGE HINTEREINANDER (Build 252).
     Bei einem Erfolgs-Schub ueberschrieb der zweite Toast den ersten
     und setzte den Timer neu - man sah EINEN davon. Jetzt gibt es
     eine Warteschlange, und waehrend sie laeuft steht die Zahl der
     wartenden daneben. */
  #achievement-toast .achievement-rest{
    font-size:calc(10px*var(--scale));color:var(--dim);
    letter-spacing:.06em}
  #achievement-toast .achievement-rest.hidden{display:none}

  /* Damit das Zurueckfedern nicht bei jedem stoert, der es nicht
     mag: wer im System "weniger Bewegung" eingestellt hat, bekommt
     den schlichten Weg von vorher. */
  @media (prefers-reduced-motion: reduce){
    #achievement-toast.show{transition:opacity .3s ease}
    #achievement-toast.show .badge{animation:none}
    #achievement-toast.show::after{animation:none}
  }
  #achievement-toast .badge{
    width:calc(56px*var(--scale));height:calc(56px*var(--scale));
    flex:none;border-radius:calc(8px*var(--scale));
    background:#1a1e27;border:1px solid rgba(255,255,255,.12)}
  #achievement-toast .badge.hidden{display:none}
  #achievement-toast .achievement-meta{display:flex;flex-direction:column;
    gap:calc(4px*var(--scale));min-width:0}
  #achievement-toast .achievement-label{font-size:calc(11px*var(--scale));
    letter-spacing:.12em;text-transform:uppercase;color:#ffd452;font-weight:700}
  #achievement-toast .achievement-title{font-size:calc(16px*var(--scale));
    font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  #achievement-toast .achievement-desc{font-size:calc(12px*var(--scale));
    color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #achievement-toast .achievement-points{font-size:calc(11px*var(--scale));
    color:#ffd452;font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div id="card" class="card corner-bottom-left">
    <img id="boxart" class="boxart hidden" alt="">
    <div class="meta">
      <div id="brand" class="brand"></div>
      <span id="sys" class="sys hidden"></span>
      <div id="cat" class="cat"></div>
      <div id="title" class="title"><span id="star" class="star">&#9733;</span><span id="titletext">-</span></div>
      <div id="facts" class="facts hidden">
        <span id="fact_genre" class="fact hidden"></span>
        <span id="fact_year" class="fact hidden"></span>
        <span id="fact_playtime" class="fact hidden"></span>
        <span id="fact_ra" class="fact ra hidden"></span>
      </div>
      <div id="list" class="list hidden"></div>
      <div id="np" class="np hidden"><span class="dot"></span><span id="npname"></span></div>
    </div>
  </div>
  <div id="ra-wall">
    <div id="ra-wall-head">
      <b id="ra-wall-count">0 / 0</b>
      <span class="pts" id="ra-wall-points"></span>
    </div>
    <div id="ra-wall-bar"><i id="ra-wall-fill"></i></div>
    <div id="ra-wall-view"><div id="ra-wall-grid"></div></div>
  </div>
  <div id="achievement-toast">
    <img id="achievement-badge" class="badge hidden" alt="">
    <div class="achievement-meta">
      <div class="achievement-label">Erfolg freigeschaltet</div>
      <div id="achievement-title" class="achievement-title"></div>
      <div id="achievement-desc" class="achievement-desc"></div>
      <div id="achievement-points" class="achievement-points"></div>
      <div id="achievement-rest" class="achievement-rest hidden"></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const root = document.documentElement.style;
let cfg = {};
let lastState = null;
let lastWall = null;

// ERFOLGE: WARTESCHLANGE, ZAEHLENDE PUNKTE, EINBLEND-MOMENT
// (Build 252)
//
// Vorher war das hier eine Funktion: Felder setzen, einblenden, nach
// acht Sekunden ausblenden. Drei Dinge fehlten.
//
// 1. MEHRERE ERFOLGE HINTEREINANDER. Der zweite Toast ueberschrieb den
//    ersten und setzte den Timer neu - bei einem Erfolgs-Schub (und die
//    gibt es, wenn ein Abschnitt im Spiel mehrere auf einmal
//    freischaltet) sah man einen davon. Jetzt werden sie in eine
//    Schlange gestellt und nacheinander gezeigt; waehrenddessen steht
//    daneben, wie viele noch warten.
// 2. DIE PUNKTE ZAEHLEN HOCH. Die Zahl steht schon im Ereignis - sie
//    von 0 heraufzuzaehlen zieht das Auge genau dorthin, wo sie steht.
// 3. Der Einblend-Moment selbst - der steckt im CSS (siehe dort).
//
// ALLES IM OVERLAY, KEINE AENDERUNG AN DER DATENLEITUNG: dasselbe
// Ereignis wie bisher, dieselben Felder. Das Overlay laeuft damit
// unveraendert mit jedem Frontend, und man kann es im Browser ansehen,
// ohne das Frontend neu zu starten.

const ACH_STANDZEIT = 7000;   // wie lange ein Toast steht
const ACH_LUECKE    = 420;    // Pause zwischen zwei Toasts
const ACH_SCHLANGE_MAX = 12;  // Notbremse, siehe unten

let achQueue = [];
let achLaeuft = false;
let achTimer = null;
let achZaehlTimer = null;

function showAchievementToast(data){
  // Respektiert den Admin-Schalter "show_ra_badges" - Standard AN,
  // wie bei den anderen show_*-Optionen (fehlend/undefined = an).
  if(cfg.show_ra_badges === false) return;
  // NOTBREMSE: ein Spiel, das aus irgendeinem Grund hundert Ereignisse
  // schickt, soll das Overlay nicht minutenlang blockieren. Die
  // aeltesten fliegen heraus, nicht die neuesten - was gerade passiert
  // ist, ist das Interessantere.
  achQueue.push(data);
  if(achQueue.length > ACH_SCHLANGE_MAX){
    achQueue = achQueue.slice(-ACH_SCHLANGE_MAX);
  }
  if(!achLaeuft) achNaechster();
}

function achNaechster(){
  const data = achQueue.shift();
  if(!data){ achLaeuft = false; return; }
  achLaeuft = true;

  $('achievement-title').textContent = data.title || '';
  $('achievement-desc').textContent = data.description || '';

  const badge = $('achievement-badge');
  if(data.badge){
    badge.src = '/badge?name=' + encodeURIComponent(data.badge);
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }

  // Wie viele warten noch? Steht nur da, wenn es welche gibt.
  const rest = $('achievement-rest');
  if(achQueue.length > 0){
    rest.textContent = '+' + achQueue.length + ' weitere';
    rest.classList.remove('hidden');
  } else {
    rest.classList.add('hidden');
  }

  const toast = $('achievement-toast');
  // NEU EINBLENDEN, AUCH WENN ER SCHON STAND: ohne das Zuruecksetzen
  // laeuft bei zwei Erfolgen hintereinander keine Animation, weil die
  // Klasse "show" ja schon dran ist. Das erzwungene Auslesen von
  // offsetWidth dazwischen ist der uebliche Weg, den Browser die
  // Aenderung wirklich anwenden zu lassen - dasselbe macht die
  // "flash"-Klasse der Hauptkarte weiter unten.
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  punkteHochzaehlen(data.points);

  if(achTimer) clearTimeout(achTimer);
  achTimer = setTimeout(() => {
    toast.classList.remove('show');
    // Die Luecke ist laenger als die Ausblendzeit (.28s), damit zwei
    // Toasts nicht ineinanderlaufen.
    setTimeout(achNaechster, ACH_LUECKE);
  }, ACH_STANDZEIT);
}

function punkteHochzaehlen(punkte){
  const el = $('achievement-points');
  if(achZaehlTimer){ cancelAnimationFrame(achZaehlTimer); achZaehlTimer = null; }
  const ziel = parseInt(punkte, 10);
  if(!ziel || ziel < 0 || !isFinite(ziel)){
    // Kein oder ein unbrauchbarer Wert: wie bisher nichts anzeigen,
    // statt eine 0 hinzuschreiben, die nichts bedeutet.
    el.textContent = punkte ? (punkte + ' Punkte') : '';
    return;
  }
  // Bei wenigen Punkten lohnt das Zaehlen nicht - ein Sprung von 0 auf
  // 2 sieht nach einem Fehler aus, nicht nach einer Animation.
  if(ziel <= 3){ el.textContent = ziel + ' Punkte'; return; }
  const dauer = 600;
  const start = performance.now();
  const schritt = (jetzt) => {
    const t = Math.min(1, (jetzt - start) / dauer);
    // Am Ende langsamer werden - sonst wirkt der letzte Wert
    // abgeschnitten statt angekommen.
    const e = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(ziel * e) + ' Punkte';
    if(t < 1){ achZaehlTimer = requestAnimationFrame(schritt); }
    else { achZaehlTimer = null; el.textContent = ziel + ' Punkte'; }
  };
  el.textContent = '0 Punkte';
  achZaehlTimer = requestAnimationFrame(schritt);
}

// DIE ERFOLGS-WAND (Build 253)
//
// Alle Erfolge des laufenden Spiels als Raster, freigeschaltete in
// Farbe, die uebrigen ausgegraut. Die Daten kommen als eigenes
// Ereignis ("achievements"), und zwar NUR wenn sie sich geaendert
// haben - der Abruf auf der Python-Seite laeuft alle 25 Sekunden.
//
// ZWEI DINGE, DIE HIER LEICHT FALSCH GEHEN, und beide sind der Grund
// fuer den Aufbau unten:
//
//  1. DAS RASTER JEDES MAL NEU ZU BAUEN waere einfacher - und wuerde
//     jedes <img> neu anlegen. Der Browser laedt dann alle hundert
//     Icons erneut an (aus seinem eigenen Cache, aber doch), und die
//     Animation der frisch freigeschalteten Kachel faende auf einem
//     Element statt, das es im Bild vorher gar nicht gab: man saehe
//     nichts aufblitzen, sondern nur ein fertiges neues Raster.
//     Gebaut wird deshalb EINMAL, danach werden nur noch Klassen
//     umgeschaltet.
//  2. BEIM ERSTEN MAL DARF NICHTS BLITZEN. Wer mitten in einem Spiel
//     das Overlay neu laedt, hat vielleicht 74 freigeschaltete
//     Erfolge - die sollen einfach da sein und nicht alle 74
//     nacheinander aufleuchten.

// DAS DURCHLAUFEN DER WAND (Build 254)
//
// Nutzerwunsch: nicht alles auf einmal zeigen, sondern eine feste
// Hoehe, durch die die Icons von oben nach unten laufen. Bei 98
// Erfolgen auf 1080p ist das der Unterschied zwischen einer Wand, die
// ein Drittel des Bildes einnimmt, und einem ruhigen Streifen.
//
// WARUM NICHT MIT EINER CSS-ANIMATION: die Strecke haengt davon ab,
// wie hoch das Raster tatsaechlich geworden ist, und das weiss erst
// der Browser, nachdem er es gesetzt hat. Eine Keyframe-Animation
// braeuchte diese Zahl im Voraus. Mit requestAnimationFrame laesst
// sich ausserdem anhalten - und genau das braucht der naechste Absatz.
//
// UND DAS IST DER PUNKT, an dem ein durchlaufendes Raster sonst
// aergerlich waere: schaltest du einen Erfolg frei, waehrend die Wand
// gerade woanders steht, siehst du das Aufblitzen nicht. Deshalb
// faehrt sie zu der Kachel und bleibt dort einen Moment stehen.

const WAND_TEMPO = 9;        // Bildpunkte je Sekunde - langsam
const WAND_PAUSE = 2200;     // Pause oben und unten, in Millisekunden
const WAND_HALT = 3000;      // Pause bei einer frisch freigeschalteten

let wandLauf = null;         // Kennung der laufenden Animation
let wandY = 0;               // jetzige Verschiebung
let wandRichtung = 1;
let wandWartetBis = 0;
let wandZuletzt = 0;

function wandScrollStoppen(){
  if(wandLauf){ cancelAnimationFrame(wandLauf); wandLauf = null; }
}

function wandScrollStarten(){
  wandScrollStoppen();
  const view = $('ra-wall-view');
  const grid = $('ra-wall-grid');
  const strecke = grid.scrollHeight - view.clientHeight;
  if(strecke <= 1){
    // Passt ohnehin - dann nicht scrollen, und die Verschiebung
    // zuruecksetzen (sonst bleibt ein halb hochgeschobenes Raster
    // stehen, wenn ein kleineres Spiel folgt).
    wandY = 0;
    grid.style.transform = 'none';
    return;
  }
  wandZuletzt = 0;
  const schritt = (jetzt) => {
    if(!wandZuletzt) wandZuletzt = jetzt;
    const dt = Math.min(100, jetzt - wandZuletzt);   // Sprünge kappen
    wandZuletzt = jetzt;
    if(jetzt >= wandWartetBis){
      wandY += wandRichtung * WAND_TEMPO * dt / 1000;
      if(wandY >= strecke){
        wandY = strecke; wandRichtung = -1; wandWartetBis = jetzt + WAND_PAUSE;
      } else if(wandY <= 0){
        wandY = 0; wandRichtung = 1; wandWartetBis = jetzt + WAND_PAUSE;
      }
    }
    grid.style.transform = 'translateY(' + (-wandY).toFixed(1) + 'px)';
    wandLauf = requestAnimationFrame(schritt);
  };
  wandLauf = requestAnimationFrame(schritt);
}

function wandZuKachel(node){
  // Die frisch freigeschaltete Kachel ins Fenster holen und dort einen
  // Moment stehenbleiben. Ohne das blitzt sie womoeglich ausserhalb
  // des sichtbaren Ausschnitts auf, und man sieht nichts.
  const view = $('ra-wall-view');
  const grid = $('ra-wall-grid');
  const strecke = grid.scrollHeight - view.clientHeight;
  if(strecke <= 1) return;
  const mitte = node.offsetTop + node.offsetHeight / 2 - view.clientHeight / 2;
  wandY = Math.max(0, Math.min(strecke, mitte));
  grid.style.transform = 'translateY(' + (-wandY).toFixed(1) + 'px)';
  wandWartetBis = performance.now() + WAND_HALT;
}

let wandStand = null;     // Badge-Name -> an/aus, Stand von eben
let wandAufbau = null;    // Badge-Name -> Element

function renderWall(daten){
  const wall = $('ra-wall');
  if(!daten || cfg.show_ra_wall !== true){
    wall.classList.remove('on');
    wandStand = null;
    wandAufbau = null;
    wandScrollStoppen();
    $('ra-wall-grid').innerHTML = '';
    return;
  }
  const items = Array.isArray(daten.items) ? daten.items : [];
  if(!items.length){
    wall.classList.remove('on');
    wandScrollStoppen();
    return;
  }

  const grid = $('ra-wall-grid');
  const spalten = Math.max(1, Math.min(40, parseInt(cfg.ra_wall_cols, 10) || 12));
  grid.style.gridTemplateColumns = 'repeat(' + spalten + ', max-content)';

  // Das Raster nur dann neu bauen, wenn es ein ANDERES Spiel ist -
  // erkennbar daran, dass sich die Menge der Badges geaendert hat.
  const schluessel = items.map(e => e.badge || '-').join(',');
  const neuesSpiel = (wandAufbau === null || wandAufbau.schluessel !== schluessel);
  const erstesMal = neuesSpiel;

  if(neuesSpiel){
    grid.innerHTML = '';
    wandAufbau = {schluessel: schluessel, el: []};
    items.forEach((e) => {
      let node;
      if(e.badge){
        node = document.createElement('img');
        node.src = '/badge?name=' + encodeURIComponent(e.badge);
        node.alt = '';
        // Ein Icon, das sich nicht laden laesst (noch nicht im Cache,
        // RA nicht erreichbar), soll kein zerbrochenes Bild zeigen.
        node.onerror = () => { node.style.visibility = 'hidden'; };
      } else {
        node = document.createElement('div');
        node.className = 'leer';
      }
      node.title = (e.titel || '') + (e.punkte ? ' (' + e.punkte + ')' : '');
      grid.appendChild(node);
      wandAufbau.el.push(node);
    });
    wandStand = null;
  }

  let frischeKachel = null;
  items.forEach((e, i) => {
    const node = wandAufbau.el[i];
    if(!node || node.classList.contains('leer')) return;
    const an = !!e.an;
    const vorher = wandStand ? wandStand[i] : null;
    node.classList.toggle('an', an);
    // Nur was GERADE umgeschlagen ist, blitzt auf - und beim ersten
    // Mal gar nichts.
    if(an && vorher === false && !erstesMal){
      node.classList.remove('frisch');
      void node.offsetWidth;
      node.classList.add('frisch');
      // Und hinfahren, falls die Wand durchlaeuft - sonst blitzt sie
      // womoeglich ausserhalb des sichtbaren Ausschnitts auf.
      frischeKachel = node;
    }
  });
  wandStand = items.map(e => !!e.an);

  // DIE FENSTERHOEHE (Build 254). 0 heisst "alles zeigen"; sonst wird
  // auf so viele Zeilen begrenzt und der Rest laeuft durch.
  //
  // Gerechnet wird aus der TATSAECHLICHEN Hoehe der ersten Kachel, und
  // nicht aus den 26 Punkten im Stylesheet: die haengen an --scale,
  // und wer das Overlay auf 150 % stellt, bekaeme sonst ein Fenster,
  // das zu zwei Dritteln leer ist.
  const view = $('ra-wall-view');
  const zeilen = Math.max(0, Math.min(40, parseInt(cfg.ra_wall_rows, 10) || 0));
  const erste = wandAufbau.el[0];
  const kh = erste ? erste.getBoundingClientRect().height : 0;
  if(zeilen > 0 && kh > 0){
    const luecke = parseFloat(getComputedStyle(grid).rowGap) || 0;
    view.style.height = (zeilen * kh + (zeilen - 1) * luecke) + 'px';
  } else {
    view.style.height = '';
  }

  const [an, gesamt] = Array.isArray(daten.anzahl) ? daten.anzahl : [0, 0];
  const [pa, pg] = Array.isArray(daten.punkte) ? daten.punkte : [0, 0];
  $('ra-wall-count').textContent = an + ' / ' + gesamt;
  $('ra-wall-points').textContent = pg ? (pa + ' / ' + pg + ' Punkte') : '';
  $('ra-wall-fill').style.width =
    (gesamt ? Math.round(an * 100 / gesamt) : 0) + '%';

  wall.className = 'wall-' + (cfg.ra_wall_corner || 'top-right') +
                   (cfg.transparent === false ? ' solid' : '') + ' on';

  // ERST JETZT das Durchlaufen (neu) anwerfen: vorher stand die Wand
  // noch auf display:none, und dann sind scrollHeight und
  // clientHeight beide 0 - die Strecke waere 0, und sie liefe nie.
  if(zeilen > 0){
    wandScrollStarten();
    if(frischeKachel) wandZuKachel(frischeKachel);
  } else {
    wandScrollStoppen();
    wandY = 0;
    grid.style.transform = 'none';
  }
}

function applyConfig(c){
  cfg = c || {};
  if(cfg.accent) root.setProperty('--accent', cfg.accent);
  if(cfg.bg) root.setProperty('--bg', cfg.bg);
  root.setProperty('--scale', ((cfg.scale||100)/100).toString());
  const card = $('card');
  card.className = 'card corner-' + (cfg.corner||'bottom-left') +
                  (cfg.transparent===false ? ' solid' : '');
  $('brand').textContent = cfg.title || '';
  // Die show_*-Schalter wirken erst in applyState() - damit sie SOFORT
  // greifen (nicht erst beim naechsten Zustandswechsel am MiSTer), den
  // zuletzt bekannten Zustand jetzt gleich neu rendern.
  if(lastState) applyState(lastState);
  // Build 253: die Wand haengt an drei Schaltern (an/aus, Ecke,
  // Spalten) - sie muss also mit, sobald sich etwas aendert. Ohne das
  // wirkte eine Aenderung erst beim naechsten Abruf, also bis zu 25
  // Sekunden spaeter, und im Backend saehe es nach einem kaputten
  // Schalter aus.
  renderWall(lastWall);
}

function applyState(s){
  lastState = s;
  const card = $('card');
  $('cat').textContent = '';
  // Build 254: der Spieltitel laesst sich abschalten. Versteckt wird
  // die ganze Zeile samt Stern - ein leerer Platzhalter "-" waere
  // schlechter als gar nichts, und der Stern ohne Titel daneben saehe
  // nach einem Fehler aus.
  const zeigeName = cfg.show_name !== false;
  $('title').style.display = zeigeName ? '' : 'none';
  $('titletext').textContent = s.name || '-';

  const star = $('star');
  if(cfg.show_favorite!==false && s.favorite){
    star.classList.add('on');
  } else star.classList.remove('on');

  const sysEl = $('sys');
  if(cfg.show_system!==false && s.system){
    sysEl.textContent = s.system; sysEl.classList.remove('hidden');
  } else sysEl.classList.add('hidden');

  const hasArt = !!s.syskey;
  const art = $('boxart');
  const artName = s.art_name || s.name;
  // Ordner (Name endet auf '/') haben kein Cover - gar nicht erst anfragen.
  const isFolder = !!artName && artName.slice(-1) === '/';
  if(cfg.show_boxart!==false && hasArt && artName && !isFolder){
    const url = '/art?sys=' + encodeURIComponent(s.syskey) +
                '&name=' + encodeURIComponent(artName);
    art.onerror = () => art.classList.add('hidden');
    art.onload  = () => art.classList.remove('hidden');
    art.src = url;
  } else art.classList.add('hidden');

  // Fakten-Zeile: Genre, Jahr, Spielzeit, RetroAchievements - jede
  // einzeln nur sichtbar, wenn die Angabe tatsaechlich vorhanden ist
  // (z.B. RA nur, wenn im Frontend eingerichtet UND ein Treffer
  // gefunden wurde - siehe lookup_ra_progress() auf der Python-Seite).
  const facts = $('facts');
  let anyFact = false;
  const setFact = (id, show, text) => {
    const el = $(id);
    if(show){ el.textContent = text; el.classList.remove('hidden'); anyFact = true; }
    else el.classList.add('hidden');
  };
  setFact('fact_genre', cfg.show_genre!==false && !!s.genre, s.genre);
  setFact('fact_year', cfg.show_genre!==false && !!s.year, s.year);
  setFact('fact_playtime', cfg.show_playtime!==false && !!s.playtime, '\u23F1 ' + s.playtime);
  setFact('fact_ra', cfg.show_ra!==false && !!s.ra_progress, '\u2B50 ' + s.ra_progress);
  facts.classList.toggle('hidden', !anyFact);

  const list = $('list');
  if(cfg.show_list!==false && Array.isArray(s.list) && s.list.length){
    list.innerHTML = '';
    s.list.forEach((row,i)=>{
      const d = document.createElement('div');
      d.className = 'row' + (i===s.list_index ? ' cur':'');
      d.textContent = row;
      list.appendChild(d);
    });
    list.classList.remove('hidden');
  } else list.classList.add('hidden');

  const np = $('np');
  if(cfg.show_nowplaying!==false && s.nowplaying){
    $('npname').textContent = '\u266A ' + s.nowplaying;
    np.classList.remove('hidden');
  } else np.classList.add('hidden');

  card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
}

function connect(){
  const es = new EventSource('/events');
  es.addEventListener('config', e => applyConfig(JSON.parse(e.data)));
  es.addEventListener('state',  e => applyState(JSON.parse(e.data)));
  es.addEventListener('achievement', e => showAchievementToast(JSON.parse(e.data)));
  // Build 253: die Erfolgs-Wand. 'null' heisst "kein Spiel mehr" -
  // dann wird sie geleert (siehe clear_achievements()).
  es.addEventListener('achievements', e => {
    try { lastWall = JSON.parse(e.data); }
    catch(err) { lastWall = null; }
    renderWall(lastWall);
  });
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
